name: Test report
description: >
  Check that a test run left reports/junit.xml and reports/coverage.xml,
  write a summary to the job page and upload both as an artifact.
  Call it with `if: always()` straight after the test step.

inputs:
  dir:
    description: Directory holding junit.xml and coverage.xml (Cobertura).
    default: reports
  artifact:
    description: Name of the uploaded artifact.
    default: test-reports

runs:
  using: composite
  steps:
    - name: Summarise
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.dir }}
      run: python3 -I "$GITHUB_ACTION_PATH/summary.py" "$REPORT_DIR" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.dir }}
        if-no-files-found: warn
