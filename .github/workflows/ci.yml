name: CI

# Public repository with no runner of its own: hosted runners are free here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck infra/*.sh tools/ngf-deploy tools/ngf-deploy.test.sh tools/ngf-host tools/ngf-tunnel

      - name: deploy.sh
        run: sh infra/deploy.test.sh

      - name: ngf-deploy
        run: sh tools/ngf-deploy.test.sh

  deploy-host:
    name: Deploy host (end to end)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: sshd
        run: |
          sudo apt-get install -y -qq openssh-server >/dev/null
          sudo systemctl start ssh

      - name: Setup, adopt, deploy over SSH, roll back, rotate the key
        run: sudo CI=true sh infra/deploy-host.test.sh

      # The deploy action itself, against the host the test above left: a new
      # version (download, checksum, upload, activate) and a broken one (rolled
      # back, the step fails). A stand-in gh serves the release from disk.
      - name: A host and a release for the deploy action
        id: prep
        run: |
          set -eu
          w=$RUNNER_TEMP/action-test
          mkdir -p "$w/rel" "$w/bin"
          ssh-keygen -q -t ed25519 -N '' -C ci-action -f "$w/key"
          sudo sh infra/deploy-host-add.sh fakesvc --unit fakesvc --health-url http://127.0.0.1:18080/healthz \
            --key "$(cat "$w/key.pub")" --keep 3 --health-wait 10 >/dev/null
          pkg() {
            rm -rf "$w/pkg" && mkdir -p "$w/pkg/fakesvc" "$w/rel/$1"
            cp -L /usr/local/bin/fakesvc "$w/pkg/fakesvc/"
            printf '{"version":"%s","commit":"c%s","built_at":"x"}\n' "$1" "$1" > "$w/pkg/fakesvc/version.json"
            if [ "${2:-}" = broken ]; then touch "$w/pkg/fakesvc/broken"; fi
            tar -czf "$w/rel/$1/fakesvc.tar.gz" -C "$w/pkg" fakesvc
            (cd "$w/rel/$1" && sha256sum fakesvc.tar.gz > SHA256SUMS)
          }
          pkg v0.1.0
          pkg v0.1.1 broken
          pkg v0.1.2
          pkg v0.1.3
          # A stand-in gh: releases from disk, and commit statuses kept as files
          # in $w/status/<sha>/<context with / as _>. A tag's commit is sha-<tag>.
          cat > "$w/bin/gh" <<'EOF'
          #!/bin/bash
          w=__W__
          if [ "$1 $2" = "release download" ]; then
            tag=$3; shift 3; dir=.
            while [ $# -gt 0 ]; do [ "$1" = -D ] && { dir=$2; shift; }; shift; done
            exec cp "$w/rel/$tag/"* "$dir/"
          fi
          [ "$1" = api ] || exit 2
          shift
          if [ "$1 $2" = "-X POST" ]; then
            sha=${3##*/} ctx=
            for a in "$@"; do case $a in context=*) ctx=${a#context=} ;; esac; done
            mkdir -p "$w/status/$sha" && echo success > "$w/status/$sha/${ctx//\//_}"
            echo "$ctx"; exit 0
          fi
          case $1 in
            */status)
              sha=$(basename "$(dirname "$1")")
              ctx=$(printf '%s' "$*" | sed -n 's/.*context == "\([^"]*\)".*/\1/p')
              f=$w/status/$sha/${ctx//\//_}
              [ -f "$f" ] && cat "$f"; exit 0 ;;
            */commits/v*) echo "sha-${1##*/}" ;;
            *) exit 2 ;;
          esac
          EOF
          sed -i "s|__W__|$w|" "$w/bin/gh"
          chmod +x "$w/bin/gh"
          echo "$w/bin" >> "$GITHUB_PATH"
          {
            echo 'key<<KEY'; cat "$w/key"; echo KEY
            echo "known_hosts=$(ssh-keyscan -t ed25519 127.0.0.1 2>/dev/null)"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy a new version through the action
        id: up
        uses: ./deploy
        with:
          service: fakesvc
          version: v0.1.0
          asset: fakesvc.tar.gz
          host: 127.0.0.1
          known-hosts: ${{ steps.prep.outputs.known_hosts }}
          ssh-key: ${{ steps.prep.outputs.key }}

      - name: It is live
        env:
          RESULT: ${{ steps.up.outputs.result }}
        run: |
          test "$RESULT" = success
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"version":"0.1.0"'
          test "$(readlink /srv/fakesvc/current)" = /srv/fakesvc/releases/v0.1.0

      - name: Deploy a broken version through the action
        id: broken
        continue-on-error: true
        uses: ./deploy
        with:
          service: fakesvc
          version: v0.1.1
          asset: fakesvc.tar.gz
          host: 127.0.0.1
          known-hosts: ${{ steps.prep.outputs.known_hosts }}
          ssh-key: ${{ steps.prep.outputs.key }}

      - name: It failed and rolled back
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          RESULT: ${{ steps.broken.outputs.result }}
        run: |
          test "$OUTCOME" = failure
          test "$RESULT" = failure
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"version":"0.1.0"'
          test "$(readlink /srv/fakesvc/current)" = /srv/fakesvc/releases/v0.1.0

      # The gate: a version without a passing status is refused before anything
      # is downloaded; break glass deploys it anyway and marks it prod/deployed.
      - name: A version without a passing status is refused
        id: gated
        continue-on-error: true
        uses: ./deploy
        with:
          service: fakesvc
          version: v0.1.2
          asset: fakesvc.tar.gz
          host: 127.0.0.1
          known-hosts: ${{ steps.prep.outputs.known_hosts }}
          ssh-key: ${{ steps.prep.outputs.key }}
          require-status: staging/smoke prod/deployed

      - name: It was refused, and nothing reached the host
        env:
          OUTCOME: ${{ steps.gated.outcome }}
        run: |
          test "$OUTCOME" = failure
          test ! -e /srv/fakesvc/releases/v0.1.2
          test "$(readlink /srv/fakesvc/current)" = /srv/fakesvc/releases/v0.1.0

      - name: Break glass deploys it, and set-status marks it
        uses: ./deploy
        with:
          service: fakesvc
          version: v0.1.2
          asset: fakesvc.tar.gz
          host: 127.0.0.1
          known-hosts: ${{ steps.prep.outputs.known_hosts }}
          ssh-key: ${{ steps.prep.outputs.key }}
          require-status: staging/smoke prod/deployed
          unverified-reason: CI test of the break-glass path
          set-status: prod/deployed

      - name: v0.1.2 is live and marked prod/deployed
        run: |
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"version":"0.1.2"'
          test "$(cat "$RUNNER_TEMP/action-test/status/sha-v0.1.2/prod_deployed")" = success
          # A version that passed staging goes through the gate.
          mkdir -p "$RUNNER_TEMP/action-test/status/sha-v0.1.3"
          echo success > "$RUNNER_TEMP/action-test/status/sha-v0.1.3/staging_smoke"

      - name: A version with staging/smoke passes the gate
        uses: ./deploy
        with:
          service: fakesvc
          version: v0.1.3
          asset: fakesvc.tar.gz
          host: 127.0.0.1
          known-hosts: ${{ steps.prep.outputs.known_hosts }}
          ssh-key: ${{ steps.prep.outputs.key }}
          require-status: staging/smoke prod/deployed
          set-status: prod/deployed

      - name: Rolling back to a version marked prod/deployed passes the gate
        uses: ./deploy
        with:
          service: fakesvc
          version: v0.1.2
          asset: fakesvc.tar.gz
          host: 127.0.0.1
          known-hosts: ${{ steps.prep.outputs.known_hosts }}
          ssh-key: ${{ steps.prep.outputs.key }}
          require-status: staging/smoke prod/deployed

      - name: Rolled back to v0.1.2
        run: curl -fsS http://127.0.0.1:18080/healthz | grep -q '"version":"0.1.2"'
